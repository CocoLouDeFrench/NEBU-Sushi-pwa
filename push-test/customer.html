<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEBU · Kunden-Test</title><style>body{font:17px system-ui;background:#101010;color:white;max-width:520px;margin:auto;padding:22px}h1{color:#f6c700}section{background:#222;padding:22px;border-radius:16px;margin:18px 0}input{box-sizing:border-box;width:100%;padding:13px;border-radius:8px;margin:8px 0 15px;font:inherit}button{background:#f6c700;border:0;border-radius:10px;padding:14px;font-weight:bold;font-size:16px}small{color:#bbb}#result{white-space:pre-wrap}</style></head><body><h1>NEBU / Kunden-Test</h1><p>Isolierte Demo. Keine echte Bestellung, keine Zahlung.</p><section><label>Test-Zugangscode<input id="key" type="password" autocomplete="off"></label><label>Name<input id="name" value="Testkunde"></label><label>Lieferadresse (nur Testdaten)<input id="address" value="Musterstraße 12, Düsseldorf"></label><h3>Test-Warenkorb</h3><p>Der Klassiker · 27,00 €<br>Maki Box · 17,50 €<br>Liefergebühr · 3,50 €</p><h2>48,00 €</h2><p><small>Die 2,3 km sind reine Testdaten; keine echte Routenprüfung.</small></p><button id="send">Testbestellung absenden</button></section><section><h2>Bestellstatus</h2><p id="result">Noch keine Bestellung</p><button id="refresh">Status aktualisieren</button></section><script>const $=id=>document.getElementById(id);$('key').value=localStorage.getItem('nebuTestKey')||'';let id=localStorage.getItem('nebuDemoCustomerOrder')||'';const api=async(method,body)=>{const key=$('key').value.trim();if(!key)throw Error('Test-Zugangscode fehlt');localStorage.setItem('nebuTestKey',key);const r=await fetch('/.netlify/functions/demo-orders',{method,headers:{'x-nebu-test-key':key,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Fehler');return d};const labels={new:'Wartet auf Bestätigung',accepted:'Angenommen',preparing:'In Zubereitung',ready:'Abholbereit',enroute:'Fahrer unterwegs',delivered:'Zugestellt',rejected:'Abgelehnt'};async function refresh(){if(!id)return;try{const d=await api('GET');const o=d.orders.find(o=>o.id===id);$('result').textContent=o?o.id+' · '+labels[o.status]+(o.eta?' · '+o.eta+' Min.':'')+'\nZahlung: '+(o.paymentReceived?'erhalten':'offen'):'Bestellung nicht gefunden'}catch(e){$('result').textContent=e.message}}$('send').onclick=async()=>{try{$('send').disabled=true;const d=await api('POST',{action:'create',customer:$('name').value,address:$('address').value});id=d.order.id;localStorage.setItem('nebuDemoCustomerOrder',id);await refresh()}catch(e){$('result').textContent=e.message}finally{$('send').disabled=false}};$('refresh').onclick=refresh;refresh();setInterval(()=>{if(id&&document.visibilityState==='visible')refresh()},10000);</script></body></html>
