<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>NEBU Sushi – Online bestellen</title>

<style>

:root{
  --background:#000000;
  --card:#0d0d0d;
  --card-soft:#151515;
  --text:#ffffff;
  --muted:#b9b9b9;
  --gold:#f6c700;
  --gold-soft:#cdb07d;
  --border:#292929;
  --danger:#f0182d;
  --whatsapp:#25d366;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--background);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  padding-bottom:110px;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

/* HEADER */

.shop-header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(0,0,0,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}

.header-main{
  max-width:1200px;
  margin:auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
}

.logo-area{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
}

.logo-area img{
  width:130px;
  max-height:62px;
  object-fit:contain;
}

.shop-name{
  display:none;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.icon-button{
  position:relative;
  width:48px;
  height:48px;
  border-radius:50%;
  border:1px solid var(--border);
  background:#0c0c0c;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}

.cart-badge{
  position:absolute;
  top:-5px;
  right:-3px;
  min-width:22px;
  height:22px;
  padding:0 6px;
  background:var(--danger);
  color:white;
  border-radius:999px;
  font-size:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.preparation-time{
  max-width:1200px;
  margin:auto;
  padding:8px 18px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  color:#eeeeee;
  font-size:17px;
}

.preparation-icon{
  width:34px;
  height:34px;
  border:2px solid white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

/* SEARCH */

.search-container{
  display:none;
  max-width:1200px;
  margin:auto;
  padding:0 18px 14px;
}

.search-container.open{
  display:block;
}

.search-container input{
  width:100%;
  border:1px solid var(--border);
  background:#151515;
  color:white;
  padding:14px 18px;
  border-radius:30px;
  outline:none;
  font-size:16px;
}

.search-container input:focus{
  border-color:var(--gold-soft);
}

/* CATEGORY NAVIGATION */

.category-wrapper{
  position:sticky;
  top:111px;
  z-index:90;
  background:#000;
  border-bottom:1px solid var(--border);
}

.category-nav{
  max-width:1200px;
  margin:auto;
  padding:14px 18px;
  display:flex;
  gap:12px;
  overflow-x:auto;
  scrollbar-width:none;
}

.category-nav::-webkit-scrollbar{
  display:none;
}

.category-button{
  flex:none;
  border:2px solid white;
  border-radius:15px;
  padding:13px 20px;
  background:var(--gold-soft);
  color:white;
  font-size:16px;
  letter-spacing:.3px;
  text-transform:uppercase;
  white-space:nowrap;
}

.category-button.active{
  background:white;
  color:#7a7a70;
}

/* HERO */

.hero{
  max-width:1200px;
  margin:auto;
  padding:32px 18px 20px;
  text-align:center;
}

.hero-logo{
  width:250px;
  max-width:70%;
  margin-bottom:12px;
}

.hero h1{
  font-size:34px;
  margin:0 0 8px;
  font-weight:400;
  letter-spacing:2px;
}

.hero p{
  margin:0;
  color:var(--muted);
  font-size:17px;
}

/* MENU */

.menu-container{
  max-width:1200px;
  margin:auto;
}

.menu-section{
  padding:20px 18px 10px;
  scroll-margin-top:190px;
}

.section-title{
  margin:0 0 26px;
  font-size:38px;
  font-weight:300;
  text-transform:uppercase;
  letter-spacing:1.5px;
}

.section-note{
  margin:-14px 0 28px;
  color:var(--muted);
  line-height:1.6;
  max-width:820px;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(2, minmax(0,1fr));
  gap:38px 22px;
}

.product-card{
  position:relative;
  min-width:0;
  text-align:center;
}

.product-image-wrapper{
  position:relative;
  width:100%;
  aspect-ratio:1 / 1;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
}

.product-image{
  width:82%;
  height:82%;
  object-fit:contain;
  filter:drop-shadow(0 10px 22px rgba(0,0,0,.55));
}

.image-fallback{
  width:80%;
  height:80%;
  background:radial-gradient(circle,#222 0%,#0c0c0c 65%,#000 100%);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#7a7a7a;
  font-size:48px;
}

.add-button{
  position:absolute;
  right:5%;
  top:6%;
  width:56px;
  height:56px;
  border-radius:50%;
  border:none;
  background:white;
  color:var(--gold-soft);
  font-size:38px;
  font-weight:300;
  line-height:1;
  box-shadow:0 4px 14px rgba(0,0,0,.35);
}

.add-button:active{
  transform:scale(.95);
}

.product-name{
  margin:0;
  min-height:52px;
  font-size:20px;
  font-weight:400;
  line-height:1.3;
  text-transform:uppercase;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.product-price{
  margin:8px 0 18px;
  font-size:21px;
}

.product-actions{
  display:flex;
  justify-content:center;
  gap:16px;
  align-items:center;
}

.favorite-button,
.info-button{
  border:none;
  background:none;
  color:white;
  padding:0;
}

.favorite-button{
  font-size:31px;
}

.info-button{
  font-size:16px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:6px;
}

.info-symbol{
  width:30px;
  height:30px;
  border:2px solid white;
  border-radius:50%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-family:serif;
  font-size:20px;
}

.unavailable{
  opacity:.38;
}

.unavailable .add-button{
  display:none;
}

.unavailable-label{
  display:inline-block;
  margin-top:8px;
  color:#d0d0d0;
  font-weight:800;
}

/* INFO MODAL */

.modal-overlay{
  position:fixed;
  inset:0;
  z-index:500;
  background:rgba(0,0,0,.78);
  display:none;
  align-items:flex-end;
  justify-content:center;
}

.modal-overlay.open{
  display:flex;
}

.product-modal{
  width:100%;
  max-width:650px;
  max-height:86vh;
  overflow-y:auto;
  background:#111;
  border-radius:24px 24px 0 0;
  border-top:1px solid #343434;
  padding:22px;
  animation:slideUp .25s ease;
}

@keyframes slideUp{
  from{
    transform:translateY(100%);
  }

  to{
    transform:translateY(0);
  }
}

.modal-close{
  float:right;
  width:42px;
  height:42px;
  border-radius:50%;
  background:#252525;
  color:white;
  border:none;
  font-size:22px;
}

.modal-image{
  width:100%;
  height:230px;
  object-fit:contain;
  margin-top:10px;
}

.product-modal h2{
  margin:18px 0 8px;
  font-size:26px;
}

.modal-price{
  color:var(--gold);
  font-size:22px;
  font-weight:800;
}

.modal-description{
  color:#d2d2d2;
  line-height:1.6;
  font-size:17px;
}

.modal-add{
  width:100%;
  margin-top:20px;
  border:none;
  border-radius:12px;
  padding:15px;
  background:white;
  color:black;
  font-weight:800;
  font-size:17px;
}

/* CART DRAWER */

.cart-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  z-index:600;
  display:none;
}

.cart-overlay.open{
  display:block;
}

.cart-drawer{
  position:absolute;
  top:0;
  right:0;
  width:min(440px,100%);
  height:100%;
  background:#111;
  padding:20px;
  overflow-y:auto;
  border-left:1px solid var(--border);
}

.cart-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.cart-header h2{
  margin:0;
  font-size:28px;
}

.close-cart{
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:#272727;
  color:white;
  font-size:22px;
}

.cart-empty{
  color:var(--muted);
  text-align:center;
  padding:40px 0;
}

.cart-row{
  padding:16px 0;
  border-bottom:1px solid var(--border);
}

.cart-row-top{
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.cart-row-name{
  font-weight:700;
}

.cart-row-price{
  white-space:nowrap;
}

.quantity-control{
  margin-top:12px;
  display:flex;
  align-items:center;
  gap:12px;
}

.quantity-control button{
  width:34px;
  height:34px;
  border-radius:50%;
  border:none;
  background:#292929;
  color:white;
  font-size:19px;
}

.cart-total{
  margin:22px 0;
  display:flex;
  justify-content:space-between;
  font-size:23px;
  font-weight:800;
}

.order-form{
  display:grid;
  gap:10px;
}

.order-form input,
.order-form select,
.order-form textarea{
  width:100%;
  border:1px solid var(--border);
  background:#1c1c1c;
  color:white;
  border-radius:10px;
  padding:13px;
  outline:none;
}

.order-form textarea{
  min-height:90px;
  resize:vertical;
}

.whatsapp-button{
  border:none;
  border-radius:12px;
  padding:15px;
  background:var(--whatsapp);
  color:white;
  font-weight:800;
  font-size:17px;
}

.cart-notice{
  color:#9f9f9f;
  font-size:13px;
  line-height:1.45;
  margin-top:12px;
}

/* FLOATING CART */

.floating-cart{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:150;
  height:60px;
  min-width:60px;
  border:none;
  border-radius:30px;
  background:white;
  color:black;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  box-shadow:0 8px 28px rgba(0,0,0,.5);
  font-weight:800;
}

.floating-count{
  min-width:24px;
  height:24px;
  padding:0 6px;
  border-radius:999px;
  background:var(--danger);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
}

/* RESPONSIVE */

@media(min-width:700px){

  .product-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:52px 30px;
  }

  .shop-name{
    display:block;
  }

}

@media(min-width:1000px){

  .product-grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  .hero{
    padding-top:50px;
  }

}

@media(max-width:520px){

  .header-main{
    padding:10px 12px;
  }

  .logo-area img{
    width:105px;
  }

  .preparation-time{
    font-size:15px;
    padding-left:14px;
    padding-right:14px;
  }

  .category-wrapper{
    top:101px;
  }

  .category-nav{
    padding-left:12px;
    padding-right:12px;
  }

  .category-button{
    padding:11px 16px;
    font-size:14px;
  }

  .hero h1{
    font-size:27px;
  }

  .menu-section{
    padding-left:12px;
    padding-right:12px;
  }

  .section-title{
    font-size:31px;
  }

  .product-grid{
    gap:38px 12px;
  }

  .product-name{
    font-size:16px;
    min-height:44px;
  }

  .product-price{
    font-size:18px;
  }

  .add-button{
    width:50px;
    height:50px;
    font-size:32px;
  }

  .info-button{
    font-size:14px;
  }

  .info-symbol{
    width:27px;
    height:27px;
  }

}

</style>
</head>

<body>

<header class="shop-header">

  <div class="header-main">

    <div class="logo-area">

      <img
        src="images/nebu-logo.png"
        alt="NEBU Sushi Logo"
      >

      <div class="shop-name">
        <strong>NEBU Sushi</strong><br>
        <small>Online bestellen</small>
      </div>

    </div>

    <div class="header-actions">

      <button
        class="icon-button"
        onclick="toggleSearch()"
        aria-label="Suche öffnen"
      >
        🔍
      </button>

      <button
        class="icon-button"
        onclick="openCart()"
        aria-label="Warenkorb öffnen"
      >
        🛒

        <span
          class="cart-badge"
          id="headerCartBadge"
        >
          0
        </span>

      </button>

    </div>

  </div>

  <div class="search-container" id="searchContainer">

    <input
      id="searchInput"

  </div>

  <div class="preparation-time">

      ◷

      Aktuelle Zubereitungszeit:

    </span>

  </div>

</header>

<div class="category-wrapper">

  <nav
    class="category-nav"
    id="categoryNav"
  ></nav>

</div>

<section class="hero">

  <img
    class="hero-logo"
    src="images/nebu-logo.png"
    alt="NEBU Sushi"
  >

  <h1>ONLINE BESTELLEN</h1>

  <p>
    Frisch zubereitet und bequem zur Abholung bestellen.
  </p>

</section>

<main
  class="menu-container"
  id="menuContainer"
></main>

<button
  class="floating-cart"
  onclick="openCart()"
>

  🛒 Warenkorb

  <span
    class="floating-count"
    id="floatingCartCount"
  >
    0
  </span>

</button>

<div
  class="modal-overlay"
  id="productModalOverlay"
  onclick="closeProductModalFromOverlay(event)"
>

  <div
    class="product-modal"
    id="productModal"
  ></div>

</div>

<div
  class="cart-overlay"
  id="cartOverlay"
  onclick="closeCartFromOverlay(event)"
>

  <aside class="cart-drawer">

    <div class="cart-header">

      <h2>Warenkorb</h2>

      <button
        class="close-cart"
        onclick="closeCart()"
      >
        ✕
      </button>

    </div>

    <div id="cartContent"></div>

  </aside>

</div>

let cart = {};

let activeModalProduct = null;

/*
====================================================
HILFSFUNKTIONEN
====================================================
*/

function euro(value){

  return value.toLocaleString(
    "de-DE",
    {
      style:"currency",
      currency:"EUR"
    }
  );

}

function createSectionId(category){

  return "section-" +
    category
      .toLowerCase()
      .replace(/ä/g,"ae")
      .replace(/ö/g,"oe")
      .replace(/ü/g,"ue")
      .replace(/ß/g,"ss")
      .replace(/[^a-z0-9]+/g,"-");

}

function createProductKey(category,name){

  return category + "||" + name;

}

/*
====================================================
KATEGORIEN
====================================================
*/

function renderCategoryNavigation(){

  const navigation =
    document.getElementById("categoryNav");

  navigation.innerHTML =
    menu.map((section,index)=>{

      return `

        <button
          class="category-button ${index === 0 ? "active" : ""}"
          onclick="scrollToCategory(
            '${createSectionId(section.category)}',
            this
          )"
        >

          ${section.category}

        </button>

      `;

    }).join("");

}

function scrollToCategory(sectionId,button){

  const section =
    document.getElementById(sectionId);

  if(section){

    section.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

  }

  document
    .querySelectorAll(".category-button")
    .forEach(item=>{
      item.classList.remove("active");
    });

  button.classList.add("active");

}

/*
====================================================
MENÜ RENDERN
====================================================
*/

function renderMenu(searchTerm=""){

  const container =
    document.getElementById("menuContainer");

  const normalizedSearch =
    searchTerm
      .trim()
      .toLowerCase();

  container.innerHTML = "";

  menu.forEach(section=>{

    const filteredItems =
      section.items.filter(product=>{

        const searchableText =
          product.name +
          " " +
          product.description;

        return !normalizedSearch ||
          searchableText
            .toLowerCase()
            .includes(normalizedSearch);

      });

    if(filteredItems.length === 0){
      return;
    }

    const sectionElement =
      document.createElement("section");

    sectionElement.className =
      "menu-section";

    sectionElement.id =
      createSectionId(section.category);

    sectionElement.innerHTML = `

      <h2 class="section-title">
        ${section.category}
      </h2>

      ${
        section.note
          ? `
            <p class="section-note">
              ${section.note}
            </p>
          `
          : ""
      }

      <div class="product-grid"></div>

    `;

    const productGrid =
      sectionElement.querySelector(".product-grid");

    filteredItems.forEach(product=>{

      const productKey =
        createProductKey(
          section.category,
          product.name
        );

      const productCard =
        document.createElement("article");

      productCard.className =
        "product-card" +
        (
          product.available
            ? ""
            : " unavailable"
        );

      productCard.innerHTML = `

        <div class="product-image-wrapper">

          <img
            class="product-image"
            src="${product.image}"
            alt="${product.name}"
            onerror="showImageFallback(this)"
          >

          ${
            product.available
              ? `
                <button
                  class="add-button"
                  onclick='addProduct(
                    ${JSON.stringify(productKey)},
                    ${JSON.stringify(product.name)},
                    ${product.price}
                  )'
                  aria-label="${product.name} hinzufügen"
                >
                  +
                </button>
              `
              : ""
          }

        </div>

        <h3 class="product-name">
          ${product.name}
        </h3>

        ${
          product.available
            ? `
              <div class="product-price">
                ${euro(product.price)}
              </div>
            `
            : `
              <div class="unavailable-label">
                Nicht verfügbar
              </div>
            `
        }

        <div class="product-actions">

          <button
            class="favorite-button"
            type="button"
            aria-label="Favorit"
          >
            ♡
          </button>

          <button
            class="info-button"
            type="button"
            onclick='openProductModal(
              ${JSON.stringify(section.category)},
              ${JSON.stringify(product.name)}
            )'
          >

            <span class="info-symbol">
              i
            </span>

            Produktinfo

          </button>

        </div>

      `;

      productGrid.appendChild(productCard);

    });

    container.appendChild(sectionElement);

  });

  if(container.children.length === 0){

    container.innerHTML = `

      <div style="
        padding:60px 20px;
        text-align:center;
        color:#aaaaaa;
      ">

        Keine passenden Artikel gefunden.

      </div>

    `;

  }

}

function showImageFallback(image){

  const fallback =
    document.createElement("div");

  fallback.className =
    "image-fallback";

  fallback.textContent =
    "🍣";

  image.replaceWith(fallback);

}

/*
====================================================
SUCHE
====================================================
*/

function toggleSearch(){

  const searchContainer =
    document.getElementById("searchContainer");

  searchContainer.classList.toggle("open");

  if(searchContainer.classList.contains("open")){

    document
      .getElementById("searchInput")
      .focus();

  }

}

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    event=>{

      renderMenu(event.target.value);

    }
  );

/*
====================================================
PRODUKTINFO
====================================================
*/

function findProduct(category,name){

  const section =
    menu.find(item=>
      item.category === category
    );

  if(!section){
    return null;
  }

  return section.items.find(item=>
    item.name === name
  );

}

function openProductModal(category,name){

  const product =
    findProduct(category,name);

  if(!product){
    return;
  }

  activeModalProduct = {
    category,
    ...product
  };

  const modal =
    document.getElementById("productModal");

  modal.innerHTML = `

    <button
      class="modal-close"
      onclick="closeProductModal()"
    >
      ✕
    </button>

    <img
      class="modal-image"
      src="${product.image}"
      alt="${product.name}"
      onerror="this.style.display='none'"
    >

    <h2>
      ${product.name}
    </h2>

    ${
      product.available
        ? `
          <div class="modal-price">
            ${euro(product.price)}
          </div>
        `
        : `
          <div class="unavailable-label">
            Nicht verfügbar
          </div>
        `
    }

    <p class="modal-description">
      ${product.description}
    </p>

    ${
      product.available
        ? `
          <button
            class="modal-add"
            onclick="addActiveModalProduct()"
          >
            Zum Warenkorb hinzufügen
          </button>
        `
        : ""
    }

  `;

  document
    .getElementById("productModalOverlay")
    .classList
    .add("open");

  document.body.style.overflow =
    "hidden";

}

function closeProductModal(){

  document
    .getElementById("productModalOverlay")
    .classList
    .remove("open");

  document.body.style.overflow =
    "";

  activeModalProduct = null;

}

function closeProductModalFromOverlay(event){

  if(
    event.target.id ===
    "productModalOverlay"
  ){

    closeProductModal();

  }

}

function addActiveModalProduct(){

  if(!activeModalProduct){
    return;
  }

  const productKey =
    createProductKey(
      activeModalProduct.category,
      activeModalProduct.name
    );

  addProduct(
    productKey,
    activeModalProduct.name,
    activeModalProduct.price
  );

  closeProductModal();

}

/*
====================================================
WARENKORB
====================================================
*/

function addProduct(key,name,price){

  if(!cart[key]){

    cart[key] = {
      name,
      price,
      quantity:0
    };

  }

  cart[key].quantity++;

  updateCartIndicators();

}

function changeQuantity(key,change){

  if(!cart[key]){
    return;
  }

  cart[key].quantity += change;

  if(cart[key].quantity <= 0){

    delete cart[key];

  }

  updateCartIndicators();

  renderCart();

}

function getCartQuantity(){

  return Object
    .values(cart)
    .reduce(
      (total,item)=>
        total + item.quantity,
      0
    );

}

function getCartTotal(){

  return Object
    .values(cart)
    .reduce(
      (total,item)=>
        total +
        (
          item.price *
          item.quantity
        ),
      0
    );

}

function updateCartIndicators(){

  const quantity =
    getCartQuantity();

  document
    .getElementById("headerCartBadge")
    .textContent =
      quantity;

  document
    .getElementById("floatingCartCount")
    .textContent =
      quantity;

}

function openCart(){

  renderCart();

  document
    .getElementById("cartOverlay")
    .classList
    .add("open");

  document.body.style.overflow =
    "hidden";

}

function closeCart(){

  document
    .getElementById("cartOverlay")
    .classList
    .remove("open");

  document.body.style.overflow =
    "";

}

function closeCartFromOverlay(event){

  if(
    event.target.id ===
    "cartOverlay"
  ){

    closeCart();

  }

}

function renderCart(){

  const cartContent =
    document.getElementById("cartContent");

  const entries =
    Object.entries(cart);

  if(entries.length === 0){

    cartContent.innerHTML = `

      <div class="cart-empty">

        Dein Warenkorb ist noch leer.

      </div>

    `;

    return;

  }

  const itemsHtml =
    entries.map(([key,item])=>{

      const itemTotal =
        item.price *
        item.quantity;

      return `

        <div class="cart-row">

          <div class="cart-row-top">

            <div class="cart-row-name">

              ${item.quantity}×
              ${item.name}

            </div>

            <div class="cart-row-price">

              ${euro(itemTotal)}

            </div>

          </div>

          <div class="quantity-control">

            <button
              onclick='changeQuantity(
                ${JSON.stringify(key)},
                -1
              )'
            >
              −
            </button>

            <span>
              ${item.quantity}
            </span>

            <button
              onclick='changeQuantity(
                ${JSON.stringify(key)},
                1
              )'
            >
              +
            </button>

          </div>

        </div>

      `;

    }).join("");

  cartContent.innerHTML = `

    ${itemsHtml}

    <div class="cart-total">

      <span>Gesamt</span>

      <span>
        ${euro(getCartTotal())}
      </span>

    </div>

    <div class="order-form">

      <input
        id="customerName"
        type="text"
        placeholder="Name *"
      >

      <input
        id="customerPhone"
        type="tel"
        placeholder="Telefonnummer *"
      >

      <select id="pickupTime">

        <option value="">
          Abholzeit auswählen *
        </option>

        <option value="Schnellstmöglich">
          Schnellstmöglich
        </option>

        <option value="In 30 Minuten">
          In 30 Minuten
        </option>

        <option value="In 40 Minuten">
          In 40 Minuten
        </option>

        <option value="In 50 Minuten">
          In 50 Minuten
        </option>

        <option value="In 60 Minuten">
          In 60 Minuten
        </option>

      </select>

      <textarea
        id="orderNote"
        placeholder="Anmerkung zur Bestellung"
      ></textarea>

      <button
        class="whatsapp-button"
        onclick="sendWhatsAppOrder()"
      >

        Bestellung per WhatsApp senden

      </button>

      <div class="cart-notice">

        Die Bestellung ist erst verbindlich,
        nachdem NEBU Sushi sie per WhatsApp
        bestätigt hat.

      </div>

    </div>

  `;

}

/*
====================================================
WHATSAPP-BESTELLUNG
====================================================
*/

function sendWhatsAppOrder(){

  const name =
    document
      .getElementById("customerName")
      .value
      .trim();

  const phone =
    document
      .getElementById("customerPhone")
      .value
      .trim();

  const pickupTime =
    document
      .getElementById("pickupTime")
      .value;

  const note =
    document
      .getElementById("orderNote")
      .value
      .trim();

  if(!name){

    alert(
      "Bitte deinen Namen eintragen."
    );

    return;

  }

  if(!phone){

    alert(
      "Bitte deine Telefonnummer eintragen."
    );

    return;

  }

  if(!pickupTime){

    alert(
      "Bitte eine Abholzeit auswählen."
    );

    return;

  }

  const orderLines =
    Object
      .values(cart)
      .map(item=>{

        const itemTotal =
          item.price *
          item.quantity;

        return (
          "• " +
          item.quantity +
          "× " +
          item.name +
          " – " +
          euro(itemTotal)
        );

      });

  const message = [

    "Hallo NEBU Sushi,",

    "",

    "ich möchte gerne folgende Bestellung zur Abholung aufgeben:",

    "",

    ...orderLines,

    "",

    "Gesamt: " +
      euro(getCartTotal()),

    "",

    "Name: " +
      name,

    "Telefonnummer: " +
      phone,

    "Gewünschte Abholzeit: " +
      pickupTime,

    note
      ? "Anmerkung: " + note
      : "",

    "",

    "Bitte bestätigt mir die Bestellung kurz. Vielen Dank!"

  ]
  .filter(Boolean)
  .join("\n");

  const whatsappNumber =
    "4915730642210";

  const whatsappUrl =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    encodeURIComponent(message);

  window.open(
    whatsappUrl,
    "_blank"
  );

}
