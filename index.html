<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1d1d1b">
<title>NEBU Sushi – Bestellung</title>

<style>
:root{
  --bg:#171716;
  --panel:#292928;
  --text:#f5f5f3;
  --muted:#c9c9c4;
  --line:#3b3b39;
  --accent:#ff7900;
  --green:#25D366;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  padding-bottom:210px;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(29,29,27,.98);
  border-bottom:1px solid var(--line);
  padding:14px 16px 10px;
}

.brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
}

.brand h1{
  margin:0;
  font-size:22px;
  letter-spacing:.4px;
}

.brand small{
  color:var(--muted);
}

.search{
  width:100%;
  border:1px solid #4a4a46;
  background:#3a3a37;
  color:white;
  border-radius:28px;
  padding:13px 18px;
  font-size:16px;
  outline:none;
}

.categories{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:12px 0 2px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.categories button{
  white-space:nowrap;
  border:1px solid #555550;
  background:#2d2d2b;
  color:white;
  border-radius:24px;
  padding:9px 14px;
  font-weight:700;
  cursor:pointer;
}

.categories button.active{
  background:#f1f1ef;
  color:#242422;
}

main{
  max-width:900px;
  margin:auto;
}

.section-head{
  background:#11110f;
  padding:24px 18px 18px;
  border-bottom:1px solid var(--line);
}

.section-head h2{
  margin:0 0 8px;
  font-size:30px;
}

.section-head p{
  margin:0;
  color:var(--muted);
  line-height:1.45;
}

.item{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  padding:20px 18px;
  background:var(--panel);
  border-bottom:1px solid var(--line);
}

.item h3{
  margin:0 0 9px;
  font-size:21px;
}

.price{
  font-size:20px;
  font-weight:700;
  margin-bottom:10px;
}

.desc{
  color:var(--muted);
  line-height:1.45;
  font-size:17px;
}

.add{
  width:50px;
  height:50px;
  border-radius:50%;
  border:1px solid #66665f;
  background:#2b2b29;
  color:var(--accent);
  font-size:34px;
  line-height:1;
  cursor:pointer;
  align-self:center;
}

.unavailable{
  opacity:.38;
}

.unavailable .add{
  display:none;
}

.unavailable-label{
  font-weight:700;
  color:#d0d0cb;
  margin-bottom:8px;
}

.cart{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:30;
  background:#f5f5f0;
  color:#1d1d1b;
  border-top:3px solid var(--accent);
  box-shadow:0 -8px 20px rgba(0,0,0,.35);
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));
}

.cart-inner{
  max-width:900px;
  margin:auto;
}

.cart-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.cart h2{
  font-size:18px;
  margin:0;
}

.total{
  font-weight:800;
  font-size:20px;
}

.cart-items{
  max-height:92px;
  overflow:auto;
  margin:8px 0;
  font-size:14px;
}

.cart-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:4px 0;
}

.qty{
  display:inline-flex;
  align-items:center;
  gap:7px;
}

.qty button{
  width:26px;
  height:26px;
  border-radius:50%;
  border:0;
  background:#2a2a27;
  color:white;
  font-weight:700;
}

.form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px;
}

.form input{
  width:100%;
  border:1px solid #c9c9c3;
  border-radius:8px;
  padding:10px;
  font-size:15px;
  background:white;
}

.send{
  grid-column:1/-1;
  border:0;
  border-radius:10px;
  background:var(--green);
  color:white;
  padding:12px;
  font-weight:800;
  font-size:16px;
  cursor:pointer;
}

.empty{
  color:#666;
}

.notice{
  padding:12px 18px;
  background:#342719;
  color:#ffd6ad;
  border-bottom:1px solid #684522;
}

@media(max-width:560px){
  .form{
    grid-template-columns:1fr;
  }

  .section-head h2{
    font-size:27px;
  }

  .item h3{
    font-size:19px;
  }

  .desc{
    font-size:16px;
  }
}
</style>
</head>

let cart = {};

function euro(value){

  return value.toLocaleString(
    "de-DE",
    {
      style:"currency",
      currency:"EUR"
    }
  );

}

function idFor(text){

  return "cat-" + text
    .toLowerCase()
    .replace(/[^a-z0-9äöüß]+/gi,"-");

}

function renderNav(){

  const nav = document.getElementById("categoryNav");

  nav.innerHTML = menu.map((category,index)=>`

    <button
      onclick="goTo('${idFor(category.category)}')"
      class="${index === 0 ? "active" : ""}"
    >

      ${category.category}

    </button>

  `).join("");

}

function goTo(id){

  const section = document.getElementById(id);

  if(section){

    section.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

  }

}

function renderMenu(filter=""){

  const root = document.getElementById("menu");

  root.innerHTML = "";

  const searchTerm = filter
    .trim()
    .toLowerCase();

  menu.forEach(category=>{

    const matchingItems = category.items.filter(item=>{

      const searchableText =
        item[0] + " " + item[2];

      return !searchTerm ||
        searchableText
          .toLowerCase()
          .includes(searchTerm);

    });

    if(!matchingItems.length){
      return;
    }

    const section = document.createElement("section");

    section.id = idFor(category.category);

    section.innerHTML = `

      <div class="section-head">

        <h2>${category.category}</h2>

        ${category.note
          ? `<p>${category.note}</p>`
          : ""
        }

      </div>

    `;

    matchingItems.forEach(item=>{

      const [
        name,
        price,
        description,
        available = true
      ] = item;

      const key =
        category.category + "||" + name;

      const article =
        document.createElement("div");

      article.className =
        "item" +
        (available === false
          ? " unavailable"
          : ""
        );

      article.innerHTML = `

        <div>

          <h3>${name}</h3>

          ${
            available === false

            ? `
              <div class="unavailable-label">
                Nicht verfügbar
              </div>
            `

            : `
              <div class="price">
                ${euro(price)}
              </div>
            `
          }

          <div class="desc">
            ${description}
          </div>

        </div>

        ${
          available === false

          ? ""

          : `
            <button
              class="add"
              aria-label="${name} hinzufügen"
              onclick='addItem(
                ${JSON.stringify(key)},
                ${JSON.stringify(name)},
                ${price}
              )'
            >
              +
            </button>
          `
        }

      `;

      section.appendChild(article);

    });

    root.appendChild(section);

  });

  if(!root.children.length){

    root.innerHTML = `

      <div class="notice">
        Keine passenden Artikel gefunden.
      </div>

    `;

  }

}

function addItem(key,name,price){

  if(!cart[key]){

    cart[key] = {
      name:name,
      price:price,
      qty:0
    };

  }

  cart[key].qty++;

  renderCart();

}

function changeQty(key,change){

  if(!cart[key]){
    return;
  }

  cart[key].qty += change;

  if(cart[key].qty <= 0){

    delete cart[key];

  }

  renderCart();

}

function renderCart(){

  const cartBox =
    document.getElementById("cartItems");

  const items =
    Object.entries(cart);

  if(!items.length){

    cartBox.innerHTML = `

      <span class="empty">
        Noch keine Artikel ausgewählt.
      </span>

    `;

    document.getElementById("total")
      .textContent = "0,00 €";

    return;

  }

  let total = 0;

  cartBox.innerHTML =
    items.map(([key,item])=>{

      const itemTotal =
        item.price * item.qty;

      total += itemTotal;

      return `

        <div class="cart-row">

          <span>
            ${item.qty}× ${item.name}
          </span>

          <span class="qty">

            <button
              onclick='changeQty(
                ${JSON.stringify(key)},
                -1
              )'
            >
              −
            </button>

            ${euro(itemTotal)}

            <button
              onclick='changeQty(
                ${JSON.stringify(key)},
                1
              )'
            >
              +
            </button>

          </span>

        </div>

      `;

    }).join("");

  document.getElementById("total")
    .textContent = euro(total);

}

function sendWhatsApp(){

  const name =
    document
      .getElementById("customerName")
      .value
      .trim();

  const pickupTime =
    document
      .getElementById("pickupTime")
      .value
      .trim();

  const phone =
    document
      .getElementById("phone")
      .value
      .trim();

  const note =
    document
      .getElementById("note")
      .value
      .trim();

  const items =
    Object.values(cart);

  if(!items.length){

    alert(
      "Bitte zuerst mindestens einen Artikel auswählen."
    );

    return;

  }

  if(!name || !pickupTime){

    alert(
      "Bitte Name und Abholzeit eintragen."
    );

    return;

  }

  let total = 0;

  const orderLines =
    items.map(item=>{

      const itemTotal =
        item.price * item.qty;

      total += itemTotal;

      return `• ${item.qty}× ${item.name} – ${euro(itemTotal)}`;

    });

  const message = [

    "Hallo NEBU Sushi,",

    "",

    `Name: ${name}`,

    `Abholzeit: ${pickupTime}`,

    phone
      ? `Telefon: ${phone}`
      : "",

    "",

    "Bestellung:",

    ...orderLines,

    "",

    `Gesamt: ${euro(total)}`,

    note
      ? `Anmerkung: ${note}`
      : "",

    "",

    "Bitte die Bestellung kurz bestätigen. Vielen Dank!"

  ]
  .filter(Boolean)
  .join("\n");

  const whatsappNumber =
    "4915730642210";

  const whatsappUrl =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    encodeURIComponent(message);

  window.open(
    whatsappUrl,
    "_blank"
  );

}

document
  .getElementById("search")
  .addEventListener(
    "input",
    event=>{
      renderMenu(event.target.value);
    }
  );

renderNav();
renderMenu();
renderCart();

</script>
