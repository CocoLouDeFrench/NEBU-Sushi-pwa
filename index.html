<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>NEBU Sushi – Online bestellen</title>

<style>

:root{
  --background:#000000;
  --card:#0d0d0d;
  --card-soft:#151515;
  --text:#ffffff;
  --muted:#b9b9b9;
  --gold:#f6c700;
  --gold-soft:#cdb07d;
  --border:#292929;
  --danger:#f0182d;
  --whatsapp:#25d366;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--background);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  padding-bottom:110px;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

/* HEADER */

.shop-header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(0,0,0,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}

.header-main{
  max-width:1200px;
  margin:auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
}

.logo-area{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
}

.logo-area img{
  width:130px;
  max-height:62px;
  object-fit:contain;
}

.shop-name{
  display:none;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.icon-button{
  position:relative;
  width:48px;
  height:48px;
  border-radius:50%;
  border:1px solid var(--border);
  background:#0c0c0c;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}

.cart-badge{
  position:absolute;
  top:-5px;
  right:-3px;
  min-width:22px;
  height:22px;
  padding:0 6px;
  background:var(--danger);
  color:white;
  border-radius:999px;
  font-size:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.preparation-time{
  max-width:1200px;
  margin:auto;
  padding:8px 18px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  color:#eeeeee;
  font-size:17px;
}

.shop-status{
  max-width:1200px;
  margin:auto;
  padding:10px 18px 0;
  display:flex;
  align-items:center;
  gap:9px;
  font-size:15px;
  font-weight:700;
  color:#eeeeee;
}

.status-dot{
  width:11px;
  height:11px;
  border-radius:50%;
  background:var(--whatsapp);
  flex:none;
}

.status-dot.closed{
  background:var(--danger);
}

.preparation-icon{
  width:34px;
  height:34px;
  border:2px solid white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

/* SEARCH */

.search-container{
  display:none;
  max-width:1200px;
  margin:auto;
  padding:0 18px 14px;
}

.search-container.open{
  display:block;
}

.search-container input{
  width:100%;
  border:1px solid var(--border);
  background:#151515;
  color:white;
  padding:14px 18px;
  border-radius:30px;
  outline:none;
  font-size:16px;
}

.search-container input:focus{
  border-color:var(--gold-soft);
}

/* CATEGORY NAVIGATION */

.category-wrapper{
  position:sticky;
  top:var(--header-height,111px);
  z-index:90;
  background:#000;
  border-bottom:1px solid var(--border);
}

.category-nav{
  max-width:1200px;
  margin:auto;
  padding:14px 18px;
  display:flex;
  gap:12px;
  overflow-x:auto;
  scrollbar-width:none;
}

.category-nav::-webkit-scrollbar{
  display:none;
}

.category-button{
  flex:none;
  border:2px solid var(--gold);
  border-radius:15px;
  padding:13px 20px;
  background:#000000;
  color:var(--gold);
  font-size:16px;
  font-weight:700;
  letter-spacing:.3px;
  text-transform:uppercase;
  white-space:nowrap;
}

.category-button.active{
  background:var(--gold);
  color:#000000;
}

/* HERO */

.hero{
  max-width:1200px;
  margin:auto;
  padding:32px 18px 20px;
  text-align:center;
}

.hero-logo{
  width:250px;
  max-width:70%;
  margin-bottom:12px;
}

.hero h1{
  font-size:34px;
  margin:0 0 8px;
  font-weight:400;
  letter-spacing:2px;
}

.hero p{
  margin:0;
  color:var(--muted);
  font-size:17px;
}

/* MENU */

.menu-container{
  max-width:1200px;
  margin:auto;
}

.menu-section{
  padding:20px 18px 10px;
  scroll-margin-top:var(--sticky-offset,190px);
}

.section-title{
  margin:0 0 26px;
  font-size:38px;
  font-weight:300;
  text-transform:uppercase;
  letter-spacing:1.5px;
}

.section-note{
  margin:-14px 0 28px;
  color:var(--muted);
  line-height:1.6;
  max-width:820px;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(2, minmax(0,1fr));
  gap:38px 22px;
}

.product-card{
  position:relative;
  min-width:0;
  text-align:center;
}

.product-image-wrapper{
  position:relative;
  width:100%;
  aspect-ratio:1 / 1;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
}

.product-image{
  width:82%;
  height:82%;
  object-fit:contain;
  filter:drop-shadow(0 10px 22px rgba(0,0,0,.55));
}

.image-fallback{
  width:80%;
  height:80%;
  background:radial-gradient(circle,#222 0%,#0c0c0c 65%,#000 100%);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#7a7a7a;
  font-size:48px;
}

.add-button{
  position:absolute;
  right:5%;
  top:6%;
  width:42px;
  height:42px;
  border-radius:50%;
  border:none;
  background:white;
  color:var(--gold-soft);
  font-size:26px;
  font-weight:300;
  line-height:1;
  box-shadow:0 4px 14px rgba(0,0,0,.35);
}

.add-button:active{
  transform:scale(.95);
}

.product-name{
  margin:0;
  min-height:52px;
  font-size:20px;
  font-weight:400;
  line-height:1.3;
  text-transform:uppercase;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.product-price{
  margin:8px 0 4px;
  font-size:21px;
}

.info-badge{
  position:absolute;
  left:6%;
  top:6%;
  z-index:5;
  display:flex;
  align-items:center;
  gap:6px;
  border:none;
  background:white;
  color:#111111;
  border-radius:20px;
  padding:6px 14px 6px 6px;
  font-size:13px;
  font-weight:700;
  box-shadow:0 4px 12px rgba(0,0,0,.35);
}

.info-badge-icon{
  width:20px;
  height:20px;
  flex:none;
  border:2px solid #111111;
  border-radius:50%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-family:serif;
  font-size:13px;
}

.unavailable{
  opacity:.38;
}

.unavailable .add-button{
  display:none;
}

.unavailable-label{
  display:inline-block;
  margin-top:8px;
  color:#d0d0d0;
  font-weight:800;
}

/* INFO MODAL */

.modal-overlay{
  position:fixed;
  inset:0;
  z-index:500;
  background:rgba(0,0,0,.78);
  display:none;
  align-items:flex-end;
  justify-content:center;
}

.modal-overlay.open{
  display:flex;
}

.product-modal{
  width:100%;
  max-width:650px;
  max-height:86vh;
  overflow-y:auto;
  background:#111;
  border-radius:24px 24px 0 0;
  border-top:1px solid #343434;
  padding:22px;
  animation:slideUp .25s ease;
}

@keyframes slideUp{
  from{
    transform:translateY(100%);
  }

  to{
    transform:translateY(0);
  }
}

.modal-close{
  float:right;
  width:42px;
  height:42px;
  border-radius:50%;
  background:#252525;
  color:white;
  border:none;
  font-size:22px;
}

.modal-image{
  width:100%;
  height:230px;
  object-fit:contain;
  margin-top:10px;
}

.product-modal h2{
  margin:18px 0 8px;
  font-size:26px;
}

.modal-price{
  color:var(--gold);
  font-size:22px;
  font-weight:800;
}

.modal-description{
  color:#d2d2d2;
  line-height:1.6;
  font-size:17px;
}

.modal-add{
  width:100%;
  margin-top:20px;
  border:none;
  border-radius:12px;
  padding:15px;
  background:white;
  color:black;
  font-weight:800;
  font-size:17px;
}

/* CART DRAWER */

.cart-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  z-index:600;
  display:none;
}

.cart-overlay.open{
  display:block;
}

.cart-drawer{
  position:absolute;
  top:0;
  right:0;
  width:min(440px,100%);
  height:100%;
  background:#111;
  padding:20px;
  overflow-y:auto;
  border-left:1px solid var(--border);
}

.cart-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.cart-header h2{
  margin:0;
  font-size:28px;
}

.close-cart{
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:#272727;
  color:white;
  font-size:22px;
}

.cart-empty{
  color:var(--muted);
  text-align:center;
  padding:40px 0;
}

.cart-row{
  padding:16px 0;
  border-bottom:1px solid var(--border);
}

.cart-row-top{
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.cart-row-name{
  font-weight:700;
}

.cart-row-price{
  white-space:nowrap;
}

.quantity-control{
  margin-top:12px;
  display:flex;
  align-items:center;
  gap:12px;
}

.quantity-control button{
  width:34px;
  height:34px;
  border-radius:50%;
  border:none;
  background:#292929;
  color:white;
  font-size:19px;
}

.cart-total{
  margin:22px 0;
  display:flex;
  justify-content:space-between;
  font-size:23px;
  font-weight:800;
}

.order-form{
  display:grid;
  gap:10px;
}

.order-form input,
.order-form select,
.order-form textarea{
  width:100%;
  border:1px solid var(--border);
  background:#1c1c1c;
  color:white;
  border-radius:10px;
  padding:13px;
  outline:none;
}

.order-form textarea{
  min-height:90px;
  resize:vertical;
}

.pickup-mode-toggle{
  display:flex;
  gap:10px;
}

.pickup-mode-button{
  flex:1;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#1c1c1c;
  color:white;
  font-weight:700;
  font-size:14px;
}

.pickup-mode-button.active{
  background:white;
  color:black;
  border-color:white;
}

.whatsapp-button{
  border:none;
  border-radius:12px;
  padding:15px;
  background:var(--whatsapp);
  color:white;
  font-weight:800;
  font-size:17px;
}

.cart-notice{
  color:#9f9f9f;
  font-size:13px;
  line-height:1.45;
  margin-top:12px;
}

/* FLOATING CART */

.floating-cart{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:150;
  height:60px;
  min-width:60px;
  border:none;
  border-radius:30px;
  background:white;
  color:black;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  box-shadow:0 8px 28px rgba(0,0,0,.5);
  font-weight:800;
}

.floating-count{
  min-width:24px;
  height:24px;
  padding:0 6px;
  border-radius:999px;
  background:var(--danger);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
}

/* RESPONSIVE */

@media(min-width:700px){

  .product-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:52px 30px;
  }

  .shop-name{
    display:block;
  }

}

@media(min-width:1000px){

  .product-grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  .hero{
    padding-top:50px;
  }

}

@media(max-width:520px){

  .header-main{
    padding:10px 12px;
  }

  .logo-area img{
    width:105px;
  }

  .preparation-time{
    font-size:15px;
    padding-left:14px;
    padding-right:14px;
  }

  .category-nav{
    padding-left:12px;
    padding-right:12px;
  }

  .category-button{
    padding:11px 16px;
    font-size:14px;
  }

  .hero h1{
    font-size:27px;
  }

  .menu-section{
    padding-left:12px;
    padding-right:12px;
  }

  .section-title{
    font-size:31px;
  }

  .product-grid{
    gap:38px 12px;
  }

  .product-name{
    font-size:16px;
    min-height:44px;
  }

  .product-price{
    font-size:18px;
  }

  .add-button{
    width:36px;
    height:36px;
    font-size:22px;
  }

  .info-badge{
    font-size:11px;
    padding:5px 10px 5px 5px;
  }

  .info-badge-icon{
    width:16px;
    height:16px;
    font-size:11px;
  }

}

</style>
</head>

<body>

<header class="shop-header">

  <div class="header-main">

    <div class="logo-area">

      <img
        id="headerLogo"
        src="nebu-logo.png"
        alt="NEBU Sushi Logo"
        onclick="handleLogoTap()"
      >

      <div class="shop-name">
        <strong>NEBU Sushi</strong><br>
        <small>Online bestellen</small>
      </div>

    </div>

    <div class="header-actions">

      <button
        class="icon-button"
        onclick="toggleSearch()"
        aria-label="Suche öffnen"
      >
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <line x1="16.6" y1="16.6" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <button
        class="icon-button"
        onclick="openCart()"
        aria-label="Warenkorb öffnen"
      >
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 4h2l2.2 12.2a2 2 0 0 0 2 1.8h7.6a2 2 0 0 0 2-1.6L20.5 8H6.2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="10" cy="21" r="1.4" fill="currentColor"/>
          <circle cx="18" cy="21" r="1.4" fill="currentColor"/>
        </svg>

        <span
          class="cart-badge"
          id="headerCartBadge"
        >
          0
        </span>

      </button>

    </div>

  </div>

  <div class="search-container" id="searchContainer">

    <input
      id="searchInput"
      type="search"
      placeholder="Nach einem Artikel suchen"
    >

  </div>

  <div class="shop-status" id="shopStatusRow">

    <span
      class="status-dot"
      id="statusDot"
    ></span>

    <span id="statusText">
      Geöffnet
    </span>

  </div>

  <div class="preparation-time">

    <div class="preparation-icon">
      ◷
    </div>

    <span>
      Aktuelle Zubereitungszeit:
      <strong>ca. 35 Minuten</strong>
    </span>

  </div>

</header>

<div class="category-wrapper">

  <nav
    class="category-nav"
    id="categoryNav"
  ></nav>

</div>

<section class="hero">

  <img
    class="hero-logo"
    src="nebu-logo.png"
    alt="NEBU Sushi"
  >

  <h1>ONLINE BESTELLEN</h1>

  <p>
    Frisch zubereitet und bequem zur Abholung bestellen.
  </p>

</section>

<main
  class="menu-container"
  id="menuContainer"
></main>

<button
  class="floating-cart"
  onclick="openCart()"
>

  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M3 4h2l2.2 12.2a2 2 0 0 0 2 1.8h7.6a2 2 0 0 0 2-1.6L20.5 8H6.2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="10" cy="21" r="1.4" fill="currentColor"/>
    <circle cx="18" cy="21" r="1.4" fill="currentColor"/>
  </svg>

  Warenkorb

  <span
    class="floating-count"
    id="floatingCartCount"
  >
    0
  </span>

</button>

<div
  class="modal-overlay"
  id="productModalOverlay"
  onclick="closeProductModalFromOverlay(event)"
>

  <div
    class="product-modal"
    id="productModal"
  ></div>

</div>

<div
  class="cart-overlay"
  id="cartOverlay"
  onclick="closeCartFromOverlay(event)"
>

  <aside class="cart-drawer">

    <div class="cart-header">

      <h2>Warenkorb</h2>

      <button
        class="close-cart"
        onclick="closeCart()"
      >
        ✕
      </button>

    </div>

    <div id="cartContent"></div>

  </aside>

</div>

<div
  class="modal-overlay"
  id="adminLoginOverlay"
  onclick="closeAdminLoginFromOverlay(event)"
>

  <div class="product-modal">

    <button
      class="modal-close"
      onclick="closeAdminLogin()"
    >
      ✕
    </button>

    <h2>Admin-Zugang</h2>

    <p class="modal-description">
      Bitte Passwort eingeben, um Zubereitungszeit
      und Verfügbarkeit zu bearbeiten.
    </p>

    <input
      id="adminPasswordInput"
      type="password"
      placeholder="Passwort"
      style="width:100%;margin-top:14px;padding:14px;border-radius:10px;border:1px solid var(--border);background:#1c1c1c;color:white;"
    >

    <div
      id="adminLoginError"
      style="color:var(--danger);margin-top:10px;display:none;"
    >
      Falsches Passwort.
    </div>

    <button
      class="modal-add"
      onclick="submitAdminLogin()"
    >
      Anmelden
    </button>

  </div>

</div>

<div
  class="modal-overlay"
  id="adminPanelOverlay"
  onclick="closeAdminPanelFromOverlay(event)"
>

  <div
    class="product-modal"
    id="adminPanel"
    style="max-width:720px;"
  ></div>

</div>

<script>

/*
====================================================
MENÜ

images/edamame.png
images/sake-maki.png

      }

    ]
  },

  {
    category:"Bowls",
    items:[

      {

HILFSFUNKTIONEN
====================================================
*/

function euro(value){

  return value.toLocaleString(
    "de-DE",
    {
      style:"currency",
      currency:"EUR"
    }
  );

}

function createSectionId(category){

  return "section-" +
    category
      .toLowerCase()
      .replace(/ä/g,"ae")
      .replace(/ö/g,"oe")
      .replace(/ü/g,"ue")
      .replace(/ß/g,"ss")
      .replace(/[^a-z0-9]+/g,"-");

}

function createProductKey(category,name){

  return category + "||" + name;

}

/*
====================================================
KATEGORIEN
====================================================
*/

function renderCategoryNavigation(){

  const navigation =
    document.getElementById("categoryNav");

  navigation.innerHTML =
    menu.map((section,index)=>{

      return `

        <button
          class="category-button ${index === 0 ? "active" : ""}"
          data-section="${createSectionId(section.category)}"
          onclick="scrollToCategory(
            '${createSectionId(section.category)}',
            this
          )"
        >

          ${section.category}

        </button>

      `;

    }).join("");

}

function scrollToCategory(sectionId,button){

  const section =
    document.getElementById(sectionId);

  if(section){

    section.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

  }

  document
    .querySelectorAll(".category-button")
    .forEach(item=>{
      item.classList.remove("active");
    });

  button.classList.add("active");

}

let categoryScrollObserver = null;

function setupCategoryScrollSpy(){

  if(categoryScrollObserver){

    categoryScrollObserver.disconnect();

  }

  const sections =
    document.querySelectorAll(".menu-section");

  if(sections.length === 0){

    return;

  }

  const header =
    document.querySelector(".shop-header");

  const wrapper =
    document.querySelector(".category-wrapper");

  const topOffset =
    (header ? header.offsetHeight : 0) +
    (wrapper ? wrapper.offsetHeight : 0);

  categoryScrollObserver = new IntersectionObserver(
    entries=>{

      entries.forEach(entry=>{

        if(!entry.isIntersecting){

          return;

        }

        const button =
          document.querySelector(
            '.category-button[data-section="' +
            entry.target.id +
            '"]'
          );

        if(!button){

          return;

        }

        document
          .querySelectorAll(".category-button")
          .forEach(item=>{
            item.classList.remove("active");
          });

        button.classList.add("active");

        button.scrollIntoView({
          behavior:"smooth",
          inline:"center",
          block:"nearest"
        });

      });

    },
    {
      rootMargin:
        "-" + (topOffset + 10) + "px 0px -70% 0px",
      threshold: 0
    }
  );

  sections.forEach(section=>{

    categoryScrollObserver.observe(section);

  });

}

function renderMenu(searchTerm=""){

  const container =
    document.getElementById("menuContainer");

  const normalizedSearch =
    searchTerm
      .trim()
      .toLowerCase();

  container.innerHTML = "";

  menu.forEach(section=>{

    const filteredItems =
      section.items.filter(product=>{

        const searchableText =
          product.name +
          " " +
          product.description;

        return !normalizedSearch ||
          searchableText
            .toLowerCase()
            .includes(normalizedSearch);

      });

    if(filteredItems.length === 0){
      return;
    }

    const sectionElement =
      document.createElement("section");

    sectionElement.className =
      "menu-section";

    sectionElement.id =
      createSectionId(section.category);

    sectionElement.innerHTML = `

      <h2 class="section-title">
        ${section.category}
      </h2>

      ${
        section.note
          ? `
            <p class="section-note">
              ${section.note}
            </p>
          `
          : ""
      }

      <div class="product-grid"></div>

    `;

    const productGrid =
      sectionElement.querySelector(".product-grid");

    filteredItems.forEach(product=>{

      const productKey =
        createProductKey(
          section.category,
          product.name
        );

      const productCard =
        document.createElement("article");

      productCard.className =
        "product-card" +
        (
          product.available
            ? ""
            : " unavailable"
        );

      productCard.innerHTML = `

        <div class="product-image-wrapper">

          <img
            class="product-image"
            src="${imageCandidates(product)[0]}"
            alt="${product.name}"
            data-candidates='${JSON.stringify(imageCandidates(product).slice(1))}'
            onerror="tryNextImage(this)"
          >

          <button
            class="info-badge"
            type="button"
            onclick='openProductModal(
              ${JSON.stringify(section.category)},
              ${JSON.stringify(product.name)}
            )'
          >

            <span class="info-badge-icon">
              i
            </span>

            Info

          </button>

          ${
            product.available
              ? `
                <button
                  class="add-button"
                  onclick='addProduct(
                    ${JSON.stringify(productKey)},
                    ${JSON.stringify(product.name)},
                    ${product.price}
                  )'
                  aria-label="${product.name} hinzufügen"
                >
                  +
                </button>
              `
              : ""
          }

        </div>

        <h3 class="product-name">
          ${product.name}
        </h3>

        ${
          product.available
            ? `
              <div class="product-price">
                ${euro(product.price)}
              </div>
            `
            : `
              <div class="unavailable-label">
                Nicht verfügbar
              </div>
            `
        }

      `;

      productGrid.appendChild(productCard);

    });

    container.appendChild(sectionElement);

  });

  if(container.children.length === 0){

    container.innerHTML = `

      <div style="
        padding:60px 20px;
        text-align:center;
        color:#aaaaaa;
      ">

        Keine passenden Artikel gefunden.

      </div>

    `;

  }

  setupCategoryScrollSpy();

}

function cleanProductName(name){

  return name
    .replace(/\s*\(.*?\)\s*/g," ")
    .replace(/\s+/g," ")
    .trim();

}

function imageCandidates(product){

  const raw =
    product.name.trim();

  const clean =
    cleanProductName(raw);

  const nameVariants = [
    clean,
    raw,
    clean.toUpperCase(),
    raw.toUpperCase()
  ];

  const extensions = [
    ".jpg",
    ".jpeg",
    ".png",
    ".JPG",
    ".JPEG",
    ".PNG"
  ];

  const list = [];

  nameVariants.forEach(variant=>{

    extensions.forEach(extension=>{

      const path =
        "images/" + variant + extension;

      if(!list.includes(path)){

        list.push(path);

      }

    });

  });

  if(
    product.image &&
    !list.includes(product.image)
  ){

    list.push(product.image);

  }

  return list;

}

function tryNextImage(image){

  let candidates = [];

  try{

    candidates =
      JSON.parse(
        image.dataset.candidates || "[]"
      );

  }catch(error){

    candidates = [];

  }

  if(candidates.length === 0){

    if(image.dataset.mode === "modal"){

      image.style.display = "none";

    }else{

      showImageFallback(image);

    }

    return;

  }

  const next =
    candidates.shift();

  image.dataset.candidates =
    JSON.stringify(candidates);

  image.src = next;

}

function showImageFallback(image){

  const fallback =
    document.createElement("div");

  fallback.className =
    "image-fallback";

  fallback.innerHTML =
    `<svg width="44%" height="44%" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

function addProduct(key,name,price){

  if(!cart[key]){

    cart[key] = {
      name,
      price,
      quantity:0
    };

  }

  cart[key].quantity++;

  updateCartIndicators();

}

function changeQuantity(key,change){

  if(!cart[key]){
    return;
  }

  cart[key].quantity += change;

  if(cart[key].quantity <= 0){

    delete cart[key];

  }

  updateCartIndicators();

  renderCart();

}

function getCartQuantity(){

  return Object
    .values(cart)
    .reduce(
      (total,item)=>
        total + item.quantity,
      0
    );

}

function getCartTotal(){

  return Object
    .values(cart)
    .reduce(
      (total,item)=>
        total +
        (
          item.price *
          item.quantity

      0
    );

}

function parsePrepMinutes(){

  const element =
    document.querySelector(".preparation-time strong");

  const text =
    element ? element.textContent : "30";

  const match =
    text.match(/\d+/);

  return match
    ? parseInt(match[0],10)
    : 30;

}

function formatClockTimeFromNow(addMinutes){

  const date =
    new Date(Date.now() + addMinutes * 60000);

  return date.toLocaleTimeString(
    "de-DE",
    { hour:"2-digit", minute:"2-digit" }
  );

}

function buildPickupNowOptions(){

  const baseMinutes =
    parsePrepMinutes();

  const offsets = [
    baseMinutes,
    baseMinutes + 15,
    baseMinutes + 30,
    baseMinutes + 45
  ];

  const options = [];

  offsets.forEach((minutes,index)=>{

    const targetDate =
      new Date(Date.now() + minutes * 60000);

    if(!isWithinOrderWindow(targetDate)){

      return;

    }

    const timeLabel =
      formatClockTimeFromNow(minutes);

    options.push({
      minutes,
      label:
        index === 0
          ? "Schnellstmöglich (ca. " + timeLabel + " Uhr)"
          : "ca. " + timeLabel + " Uhr"
    });

  });

  return options;

}

function minDateTimeLocalValue(){

  const baseMinutes =
    parsePrepMinutes();

  const date =
    new Date(Date.now() + baseMinutes * 60000);

  const pad =
    number => String(number).padStart(2,"0");

  return (
    date.getFullYear() +
    "-" +
    pad(date.getMonth() + 1) +
    "-" +
    pad(date.getDate()) +
    "T" +
    pad(date.getHours()) +
    ":" +
    pad(date.getMinutes())
  );

}

function formatPickupLaterLabel(value){

  const date =
    new Date(value);

  const dateLabel =
    date.toLocaleDateString(
      "de-DE",
      { weekday:"long", day:"2-digit", month:"2-digit", year:"numeric" }
    );

  const timeLabel =
    date.toLocaleTimeString(
      "de-DE",
      { hour:"2-digit", minute:"2-digit" }
    );

  return "Vorbestellung – " + dateLabel + " um " + timeLabel + " Uhr";

}

function setPickupMode(mode){

  document
    .getElementById("pickupModeNowButton")

  document

  document.getElementById("pickupMode").value = mode;

}

function isPlausiblePhoneNumber(value){

  const digitsOnly =
    value.replace(/[^\d]/g,"");

  if(digitsOnly.length < 7 || digitsOnly.length > 15){

    return false;

  }

  if(/^(\d)\1+$/.test(digitsOnly)){

    return false;

  }

  const ascending = "0123456789";

  const descending = "9876543210";

  if(
    ascending.includes(digitsOnly) ||
    descending.includes(digitsOnly)
  ){

    return false;

  }

  const knownFakeNumbers = [
    "1234567",
    "12345678",
    "123456789",
    "1234567890",
    "0000000",
    "1111111",
    "0123456"
  ];

  if(knownFakeNumbers.includes(digitsOnly)){

    return false;

  }

  return true;

}

function sendWhatsAppOrder(){

  if(!canOrderNow()){

    alert(
      "Wir nehmen aktuell keine Bestellungen an. " +
      "Öffnungszeiten: täglich 16:00–21:00 Uhr " +
      "(letzte Bestellung 20:50 Uhr)."
    );

  }

  const name =
    document
      .getElementById("customerName")
      .value
      .trim();

  const phone =
    document
      .getElementById("customerPhone")
      .value
      .trim();

  const pickupMode =
    document
      .getElementById("pickupMode")
      .value;

  const note =
    document
      .getElementById("orderNote")
      .value
      .trim();

  if(!name){

    alert(
      "Bitte deinen Namen eintragen."
    );

    return;

  }

  if(!phone){

    alert(
      "Bitte deine Telefonnummer eintragen."
    );

    return;

  }

  if(!isPlausiblePhoneNumber(phone)){

    alert(
      "Bitte eine gültige Telefonnummer eintragen " +
      "(mind. 7 Ziffern, keine Fantasienummer wie 123456)."
    );

    return;

  }

  let pickupLabel = "";

  if(pickupMode === "later"){

    const pickupLaterValue =
      document
        .getElementById("pickupTimeLater")
        .value;

    if(!pickupLaterValue){

      alert(
        "Bitte Datum und Uhrzeit für die Vorbestellung auswählen."
      );

      return;

    }

    const pickupLaterDate =
      new Date(pickupLaterValue);

    if(!isWithinOrderWindow(pickupLaterDate)){

      alert(
        "Vorbestellungen sind nur zwischen 16:00 und 20:50 Uhr möglich. " +
        "Bitte eine andere Uhrzeit wählen."
      );

      return;

    }

    pickupLabel =
      formatPickupLaterLabel(pickupLaterValue);

  }else{

    const pickupNowValue =
      document
        .getElementById("pickupTimeNow")
        .value;

    if(!pickupNowValue){

      alert(
        "Bitte eine Abholzeit auswählen."
      );

      return;

    }

    pickupLabel =
      pickupNowValue;

  }

  const orderLines =
    Object
      .values(cart)
      .map(item=>{

        const itemTotal =
          item.price *
          item.quantity;

        return (
          "• " +
          item.quantity +
          "× " +
          item.name +
          " – " +
          euro(itemTotal)
        );

      });

  const message = [

    "Hallo NEBU Sushi,",

    "",

    ...orderLines,

    "",

    "Gesamt: " +
      euro(getCartTotal()),

    "",

    "Name: " +
      name,

    "Telefonnummer: " +
      phone,

    "Gewünschte Abholzeit: " +
      pickupLabel,

    note
      ? "Anmerkung: " + note
      : "",

    "",

    "Bitte bestätigt mir die Bestellung kurz. Vielen Dank!"

  ]
  .filter(Boolean)
  .join("\n");

  const confirmed =
    window.confirm(
      "Bitte kurz prüfen:\n\n" +
      "Name: " + name + "\n" +
      "Telefonnummer: " + phone + "\n" +
      "Abholzeit: " + pickupLabel + "\n" +
      "Gesamt: " + euro(getCartTotal()) + "\n\n" +
      "Bestellung jetzt per WhatsApp senden?"
    );

  if(!confirmed){

    return;

  }

  const whatsappNumber =
    "4915730642210";

  const whatsappUrl =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    encodeURIComponent(message);

  window.open(
    whatsappUrl,
    "_blank"
  );

}

function adjustStickyOffsets(){

    "--sticky-offset",

  );

const OPENING_HOURS = {
  openHour: 16,
  openMinute: 0,
  closeHour: 21,
  closeMinute: 0,
  lastOrderHour: 20,
  lastOrderMinute: 50
};

function minutesSinceMidnight(date){

  return date.getHours() * 60 + date.getMinutes();

}

function isWithinOpeningHours(date = new Date()){

  const minutes = minutesSinceMidnight(date);

  const openMinutes =
    OPENING_HOURS.openHour * 60 + OPENING_HOURS.openMinute;

  const closeMinutes =
    OPENING_HOURS.closeHour * 60 + OPENING_HOURS.closeMinute;

  return minutes >= openMinutes && minutes < closeMinutes;

}

function isWithinOrderWindow(date = new Date()){

  const minutes = minutesSinceMidnight(date);

  const openMinutes =
    OPENING_HOURS.openHour * 60 + OPENING_HOURS.openMinute;

  const lastOrderMinutes =
    OPENING_HOURS.lastOrderHour * 60 + OPENING_HOURS.lastOrderMinute;

  return minutes >= openMinutes && minutes < lastOrderMinutes;

}

let currentStatusMode = "auto";

function canOrderNow(){

  if(currentStatusMode === "closed"){

    return false;

  }

  return isWithinOrderWindow();

}

async function saveAdminChanges(){

  const prepTime =
    document
      .getElementById("adminPrepTimeInput")
      .value;

  const statusMode =
    document
      .getElementById("adminStatusModeValue")
      .value;

  const checkboxes =
    document.querySelectorAll(
      "#adminItemList input[type=checkbox]"
    );

  const soldOut =
    Array.from(checkboxes)
      .filter(checkbox=> checkbox.checked)
      .map(checkbox=> checkbox.dataset.key);

  try{

    const response = await fetch("/api/menu-state", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ password: adminPassword, prepTime, statusMode, soldOut })
    });

    if(!response.ok){

      alert("Speichern fehlgeschlagen. Bitte Admin-Bereich erneut öffnen.");

      return;

    }

    closeAdminPanel();

    applyMenuState({ prepTime, statusMode, soldOut });

  }catch(error){

    alert("Verbindung fehlgeschlagen. Bitte später erneut versuchen.");

  }

}

let shopIsOpen = true;

function refreshShopStatusDisplay(){

  const statusDot =
    document.getElementById("statusDot");

  const statusText =
    document.getElementById("statusText");

  shopIsOpen =
    currentStatusMode === "open"
      ? true
      : currentStatusMode === "closed"
        ? false
        : isWithinOpeningHours();

  if(statusDot && statusText){

    statusDot.classList.toggle("closed", !shopIsOpen);

    statusText.textContent =
      shopIsOpen ? "Geöffnet" : "Geschlossen";

  }

}

function applyMenuState(state){

  const prepTimeElement =
    document.querySelector(".preparation-time strong");

  if(prepTimeElement && state.prepTime){

    prepTimeElement.textContent = state.prepTime;

  }

  currentStatusMode =
    state.statusMode ||
    (state.isOpen === false ? "closed" : "auto");

  refreshShopStatusDisplay();

  menu.forEach(section=>{

    section.items.forEach(product=>{

      if(product.price > 0){

        const key =
          createProductKey(section.category, product.name);

        product.available =
          !state.soldOut.includes(key);

      }

    });

  });

  renderMenu(
    document.getElementById("searchInput").value
  );

}

async function loadMenuState(){

  try{

    const response = await fetch("/api/menu-state");

    if(!response.ok){

      return;

    }

    const state = await response.json();

    applyMenuState(state);

  }catch(error){

    // Kein Zugriff auf den Admin-Speicher – Standardwerte bleiben aktiv.

  }

}

renderCategoryNavigation();

updateCartIndicators();

adjustStickyOffsets();
